# vim:fileencoding=utf-8:ft=conf
font_family      RobotoMono Nerd Font Medium
italic_font      RobotoMono Nerd Font Medium Italic
bold_font        RobotoMono Nerd Font Bold
bold_italic_font RobotoMono Nerd Font Bold Italic

# Font size (in pts)
font_size 15.0

confirm_os_window_close 0
copy_on_select yes

# Dedicated HID clipboard keys used by kanata's Space+U/Space+I aliases and
# by the Ferris Sweep (ZMK K_COPY/K_PASTE/K_CUT). GTK/Qt/Firefox handle these
# natively; kitty does not, so bind them here. They never mean SIGINT like
# Ctrl+C. Key names are case-sensitive XKB names.
map XF86Copy copy_to_clipboard
map XF86Paste paste_from_clipboard
map XF86Cut copy_to_clipboard

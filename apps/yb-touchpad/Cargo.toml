[package]
name = "yb-touchpad"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.5"
libc = "0.2"
evdev = "0.13"
inotify = "0.11"
serde_json = "1"
futures-channel = "0.3"
futures-util = "0.3"

[profile.release]
lto = true
strip = true

# Read by plugins when they load (continuum appends its autosave hook to
# status-right; prefix-highlight / agent-indicator fill in their #{...}
# placeholders), so tmux.nix loads this before the plugins, tmux.conf after.

set -g @continuum-boot 'on'
set -g @continuum-restore 'on'

# Relaunch agent CLIs with their previous conversation on restore
set -g @resurrect-processes '"~opencode->agent-resume opencode *" "~claude->agent-resume claude *" "~agy->agent-resume agy *"'

# Nightfox colors for Tmux
# Style: nightfox
# Upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/nightfox/nightfox.tmux
set -g mode-style "fg=#131a24,bg=#aeafb0"
set -g message-style "fg=#131a24,bg=#aeafb0"
set -g message-command-style "fg=#131a24,bg=#aeafb0"
set -g pane-border-style "fg=#aeafb0"
set -g pane-active-border-style "fg=#719cd6"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#aeafb0,bg=#131a24"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#131a24,bg=#719cd6,bold] #S #[fg=#719cd6,bg=#131a24,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#131a24,bg=#131a24,nobold,nounderscore,noitalics]#[fg=#719cd6,bg=#131a24] #{prefix_highlight} #[fg=#aeafb0,bg=#131a24,nobold,nounderscore,noitalics]#[fg=#131a24,bg=#aeafb0] #{agent_indicator}  %Y-%m-%d  %I:%M %p #[fg=#719cd6,bg=#aeafb0,nobold,nounderscore,noitalics]#[fg=#131a24,bg=#719cd6,bold] #h "

# Tmux Agent Indicator
# Notify sketchybar on ALL state transitions (default only fires for needs-input,done)
set -g @agent-indicator-notification-states "running,needs-input,done,off"
# State icons (using Nerd Font symbols corresponding to current SketchyBar icons)
set -g @agent-indicator-icon-running "●"      # yellow/working
set -g @agent-indicator-icon-needs-input "●"  # red/confirm
set -g @agent-indicator-icon-done "●"         # purple/recent
set -g @agent-indicator-icon-off "○"          # gray/idle

# Process monitoring fallback
set -g @agent-indicator-processes "claude,.claude-wrapped,gemini,aider,cursor,antigravity,agy"
set -g @agent-indicator-interval 2

setw -g window-status-activity-style "underscore,fg=#71839b,bg=#131a24"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#71839b,bg=#131a24"
# One marker per agent pane in the window, from @agent_state (set by the
# agent-state wrapper in tmux.nix): ⚠ needs input, ✓ finished (cleared when
# you visit the pane), ● working. #{P:...} loops over the panes; each marker
# restores the text colour of its format afterwards.
set -g @agent-marks-normal "#{P:#{?#{==:#{@agent_state},needs-input},#[fg=#c94f6d]⚠#[fg=#71839b] ,#{?#{==:#{@agent_state},done},#[fg=#81b29a]✓#[fg=#71839b] ,#{?#{==:#{@agent_state},running},#[fg=#dbc074]●#[fg=#71839b] ,}}}}"
set -g @agent-marks-current "#{P:#{?#{==:#{@agent_state},needs-input},#[fg=#c94f6d]⚠#[fg=#131a24] ,#{?#{==:#{@agent_state},done},#[fg=#81b29a]✓#[fg=#131a24] ,#{?#{==:#{@agent_state},running},#[fg=#dbc074]●#[fg=#131a24] ,}}}}"
setw -g window-status-format "#[fg=#131a24,bg=#131a24,nobold,nounderscore,noitalics]#[default] #I  #W #{E:@agent-marks-normal}#F #[fg=#131a24,bg=#131a24,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#131a24,bg=#aeafb0,nobold,nounderscore,noitalics]#[fg=#131a24,bg=#aeafb0,bold] #I  #W #{E:@agent-marks-current}#F #[fg=#aeafb0,bg=#131a24,nobold,nounderscore,noitalics]"

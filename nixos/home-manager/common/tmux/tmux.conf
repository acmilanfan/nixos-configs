set-option -ga terminal-overrides ",xterm-256color*:Tc"
set-option -g detach-on-destroy off

# Ensure shell is started as login shell
set-option -g default-command "exec $SHELL -l"

set -g status-position top

# default-terminal, base-index, pane-base-index and mode-keys come from
# programs.tmux (tmux.nix).
set-option -g renumber-windows on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y is left to tmux-yank (copies to the system clipboard)

bind-key f run-shell "tmux neww tmux-sessionizer"
bind-key W run-shell "tmux neww worktree-switch --tmux"

# The prefix is tmux's default C-b (prefix C-b sends it through).
# Also bind the alternative in case the terminal handles it differently
bind-key M-b send-prefix

bind -r J resize-pane -D 10
bind -r K resize-pane -U 10

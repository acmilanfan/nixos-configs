set-option -ga terminal-overrides ",xterm-256color*:Tc"
set-option -g default-terminal "xterm-256color"
set-option -g detach-on-destroy off

# Ensure shell is started as login shell
set-option -g default-command "exec $SHELL -l"

set -g status-position top

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -r f run-shell "tmux neww tmux-sessionizer"
bind-key -r W run-shell "tmux neww worktree-switch --tmux"

# Configure tmux to work with swapped Control/Command keys
# After key swap, the physical Ctrl key now sends Cmd codes
# We need to set the prefix to what the system now considers as Control
unbind C-b
set-option -g prefix C-b
bind-key C-b send-prefix

# Also bind the alternative in case the terminal handles it differently
bind-key M-b send-prefix

bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
